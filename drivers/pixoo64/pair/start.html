<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Pixoo64</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: #1a1a1a;
      padding: 24px;
      max-width: 420px;
      margin: 0 auto;
    }

    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 12px;
      background: #007aff;
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: #0062cc; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #007aff;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid #007aff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f0f7ff; }

    /* Loading */
    .loading-wrap { text-align: center; padding: 40px 0; }

    .spinner-lg {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-msg { font-size: 14px; color: #666; }

    /* Device cards */
    .device-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .device-card:hover { border-color: #007aff; background: #f0f7ff; }
    .device-card.disabled { opacity: 0.5; pointer-events: none; }

    .device-name { font-size: 15px; font-weight: 600; }
    .device-ip   { font-size: 12px; color: #888; margin-top: 2px; }
    .device-revision { font-size: 12px; color: #148a2c; margin-top: 2px; }
    .device-arrow { font-size: 20px; color: #ccc; line-height: 1; }

    /* Footer buttons below results */
    .result-footer { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- ① Initial choice screen -->
  <div id="screen-start">
    <h1>Add Pixoo64</h1>
    <p class="subtitle">How would you like to find your device?</p>
    <button class="btn-primary"    id="btn-auto">Search automatically</button>
    <button class="btn-secondary"  id="btn-manual">Enter IP manually</button>
  </div>

  <!-- ② Scan in progress -->
  <div id="screen-loading" class="hidden">
    <div class="loading-wrap">
      <div class="spinner-lg"></div>
      <div class="loading-msg">Searching for devices on your network…</div>
      <div id="scan-subnet" style="font-size:11px;color:#aaa;margin-top:8px;"></div>
    </div>
  </div>

  <!-- ③ Results (found or empty) -->
  <div id="screen-results" class="hidden">
    <h1  id="results-title"></h1>
    <p   id="results-subtitle" class="subtitle"></p>
    <div id="device-list"></div>
    <div class="result-footer">
      <button class="btn-secondary" id="btn-retry">Search again</button>
      <button class="btn-secondary" id="btn-manual-2">Enter IP manually</button>
    </div>
  </div>

  <script>
    /* ── helpers ──────────────────────────────────────────────────────────── */

    function show(id) {
      ['screen-start', 'screen-loading', 'screen-results'].forEach((s) => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    }

    function renderResults(devices) {
      const list     = document.getElementById('device-list');
      const title    = document.getElementById('results-title');
      const subtitle = document.getElementById('results-subtitle');

      list.innerHTML = '';

      if (!Array.isArray(devices) || devices.length === 0) {
        title.textContent    = 'No devices found';
        subtitle.textContent = 'Make sure your Pixoo64 is on and on the same Wi-Fi network.';
        return;
      }

      title.textContent    = devices.length === 1 ? '1 device found' : `${devices.length} devices found`;
      subtitle.textContent = '';

      devices.forEach((device) => {
        const card = document.createElement('div');
        card.className = 'device-card';
        const infoWrap = document.createElement('div');
        const nameEl = document.createElement('div');
        nameEl.className = 'device-name';
        nameEl.textContent = device && device.name ? String(device.name) : 'Pixoo64';

        const ipEl = document.createElement('div');
        ipEl.className = 'device-ip';
        ipEl.textContent = (device && device.settings && device.settings.ip)
          ? String(device.settings.ip)
          : '';
        const revisionEl = document.createElement('div');
        revisionEl.className = 'device-revision';
        revisionEl.textContent = revisionMessage(device && device.settings && device.settings.api_revision);

        const arrowEl = document.createElement('div');
        arrowEl.className = 'device-arrow';
        arrowEl.textContent = '›';

        infoWrap.appendChild(nameEl);
        infoWrap.appendChild(ipEl);
        if (revisionEl.textContent) infoWrap.appendChild(revisionEl);
        card.appendChild(infoWrap);
        card.appendChild(arrowEl);
        card.addEventListener('click', async () => {
          card.classList.add('disabled');
          try {
            await Homey.createDevice(device);
            await Homey.done();
          } catch (_) {
            card.classList.remove('disabled');
          }
        });
        list.appendChild(card);
      });
    }

    function revisionMessage(revision) {
      if (revision === 'New revision') return 'Pixoo64 New Revision Detected';
      if (revision === 'Legacy revision') return 'Pixoo64 Legacy Revision Detected';
      return '';
    }

    async function runDiscovery() {
      show('screen-loading');
      try {
        const devices = await Homey.emit('discover');
        renderResults(devices);
      } catch (_) {
        renderResults([]);
      }
      show('screen-results');
    }

    /* ── event listeners ─────────────────────────────────────────────────── */

    // Show what the driver is doing during discovery
    Homey.on('scan_info', ({ subnet }) => {
      const el = document.getElementById('scan-subnet');
      if (!el) return;
      el.textContent = (subnet === 'cloud' || !subnet)
        ? 'Querying Divoom cloud…'
        : `Scanning ${subnet}.0/24`;
    });

    document.getElementById('btn-auto').addEventListener('click', runDiscovery);
    document.getElementById('btn-retry').addEventListener('click', runDiscovery);

    document.getElementById('btn-manual').addEventListener('click', () => {
      Homey.showView('ip_input');
    });
    document.getElementById('btn-manual-2').addEventListener('click', () => {
      Homey.showView('ip_input');
    });

    Homey.ready();
  </script>

</body>
</html>
